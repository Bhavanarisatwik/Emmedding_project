<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In — NeuralKB</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      background: #09090b;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', sans-serif;
      -webkit-font-smoothing: antialiased;
      overflow: hidden;
    }

    /* Ambient glow blobs */
    .blob {
      position: fixed; border-radius: 50%; filter: blur(80px); pointer-events: none; z-index: 0;
    }
    .blob-1 { width: 500px; height: 500px; top: -200px; left: 50%; transform: translateX(-60%); background: rgba(99,102,241,0.08); }
    .blob-2 { width: 300px; height: 300px; bottom: -100px; right: 10%; background: rgba(99,102,241,0.05); }

    .card {
      position: relative; z-index: 1;
      width: calc(100% - 32px); max-width: 380px;
      background: #111113;
      border: 1px solid #1c1c1f;
      border-radius: 24px;
      padding: 48px 36px 36px;
      box-shadow: 0 32px 80px rgba(0,0,0,0.7), 0 0 0 1px rgba(255,255,255,0.02), 0 0 60px rgba(99,102,241,0.04);
    }

    .logo {
      text-align: center; margin-bottom: 36px;
    }
    .logo-icon {
      width: 60px; height: 60px; border-radius: 18px;
      background: rgba(99,102,241,0.12);
      border: 1px solid rgba(99,102,241,0.25);
      display: inline-flex; align-items: center; justify-content: center;
      margin-bottom: 16px;
      box-shadow: 0 0 40px rgba(99,102,241,0.2);
      animation: glow-pulse 3s ease-in-out infinite;
    }
    @keyframes glow-pulse {
      0%, 100% { box-shadow: 0 0 30px rgba(99,102,241,0.15); }
      50%       { box-shadow: 0 0 50px rgba(99,102,241,0.28); }
    }
    .logo h1 { font-size: 22px; font-weight: 700; color: #fafafa; letter-spacing: -0.5px; }
    .logo p  { font-size: 13px; color: #3f3f46; margin-top: 5px; }

    label {
      display: block;
      font-size: 11px; font-weight: 600;
      letter-spacing: 0.07em; text-transform: uppercase;
      color: #3f3f46; margin-bottom: 8px;
    }

    .input-wrap { position: relative; }

    input[type="password"], input[type="text"] {
      width: 100%;
      background: #0d0d0f;
      border: 1px solid #1c1c1f;
      border-radius: 12px;
      padding: 12px 44px 12px 14px;
      font-size: 15px; color: #fafafa;
      outline: none; font-family: inherit;
      transition: border-color 0.15s, box-shadow 0.15s;
      letter-spacing: 0.5px;
    }
    input::placeholder { color: #27272a; letter-spacing: 0; }
    input:focus {
      border-color: rgba(99,102,241,0.45);
      box-shadow: 0 0 0 3px rgba(99,102,241,0.08);
    }

    .toggle-pw {
      position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
      background: none; border: none; cursor: pointer;
      color: #27272a; padding: 4px; transition: color 0.15s;
    }
    .toggle-pw:hover { color: #71717a; }

    .error {
      margin-top: 12px;
      font-size: 12.5px; color: #f87171;
      display: flex; align-items: center; gap: 7px;
      background: rgba(127,29,29,0.2); border: 1px solid rgba(239,68,68,0.2);
      border-radius: 10px; padding: 9px 12px;
      animation: shake 0.3s ease;
    }
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25%       { transform: translateX(-4px); }
      75%       { transform: translateX(4px); }
    }

    button[type="submit"] {
      margin-top: 20px; width: 100%; padding: 13px;
      background: linear-gradient(135deg, #6366f1 0%, #818cf8 100%);
      color: #fff; font-size: 14px; font-weight: 600;
      border: none; border-radius: 12px; cursor: pointer;
      font-family: inherit; letter-spacing: 0.1px;
      box-shadow: 0 4px 20px rgba(99,102,241,0.35);
      transition: opacity 0.15s, transform 0.1s, box-shadow 0.15s;
    }
    button[type="submit"]:hover {
      opacity: 0.92;
      box-shadow: 0 6px 28px rgba(99,102,241,0.45);
    }
    button[type="submit"]:active { transform: scale(0.98); }

    .footer-note {
      text-align: center;
      margin-top: 20px;
      font-size: 11px; color: #27272a;
    }
  </style>
</head>
<body>
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>

  <div class="card">
    <div class="logo">
      <div class="logo-icon">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#818cf8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 3l1.8 5.4L19 10l-5.2 1.8L12 17l-1.8-5.4L5 10l5.2-1.8L12 3z"/>
          <path d="M5 3l.9 2.7L8.5 7l-2.6.9L5 10.6 4.1 7.9 1.5 7l2.6-.9L5 3z"/>
          <path d="M19 17l.9 2.7 2.6.9-2.6.9-.9 2.7-.9-2.7-2.6-.9 2.6-.9.9-2.7z"/>
        </svg>
      </div>
      <h1>NeuralKB</h1>
      <p>Enter your password to continue</p>
    </div>

    <form method="POST" action="/login" autocomplete="on">
      <label for="password">Password</label>
      <div class="input-wrap">
        <input
          type="password" id="password" name="password"
          placeholder="••••••••••••"
          autofocus autocomplete="current-password"
        />
        <button type="button" class="toggle-pw" onclick="togglePw()" title="Show/hide password">
          <svg id="eye-icon" xmlns="http://www.w3.org/2000/svg" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
          </svg>
        </button>
      </div>

      {% if error %}
      <div class="error">
        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>
        </svg>
        {{ error }}
      </div>
      {% endif %}

      <button type="submit">Sign In</button>
    </form>

    <p class="footer-note">NeuralKB — Personal AI Knowledge Base</p>
  </div>

  <script>
    function togglePw() {
      const inp = document.getElementById('password');
      const ico = document.getElementById('eye-icon');
      if (inp.type === 'password') {
        inp.type = 'text';
        ico.innerHTML = '<path d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19"/><line x1="1" y1="1" x2="23" y2="23"/>';
      } else {
        inp.type = 'password';
        ico.innerHTML = '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>';
      }
    }
  </script>
</body>
</html>
