name: neuralkb_mobile
description: "NeuralKB - Your Personal AI Knowledge Base"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.5.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  
  # HTTP & API
  http: ^1.2.0
  
  # File picking
  file_picker: ^8.0.0+1
  image_picker: ^1.1.0
  
  # Storage
  shared_preferences: ^2.2.2
  
  # Markdown rendering
  flutter_markdown: ^0.6.22
  
  # UUID
  uuid: ^4.4.0
  
  # Provider for state management
  provider: ^6.1.1
  
  # HTML parsing for markdown
  flutter_html: ^3.0.0-beta.2
  
  # Time formatting
  timeago: ^3.6.1
  
  # Shimmer loading
  shimmer: ^3.0.0
  
  # URL launcher
  url_launcher: ^6.2.5

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
