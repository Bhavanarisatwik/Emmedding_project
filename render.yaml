services:
  - type: web
    name: neuralkb-api
    env: python
    runtime: python-3.12
    buildCommand: pip install -r requirements.txt
    startCommand: python app.py
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: PINECONE_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_API_BASE
        sync: false
    autoDeploy: true
